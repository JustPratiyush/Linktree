  /* Palette from abhinavkuchhal.com */
  :root {
    --bg: #000000;
    --bar: #101012;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.62);
    --text-faint: rgba(255, 255, 255, 0.38);
    --live: #f45b5b;
    --graveyard: #b3141c;
    --panel: rgba(10, 10, 12, 0.78);
    --panel-border: rgba(255, 255, 255, 0.09);
    --rule: rgba(255, 255, 255, 0.15);
    --underline: rgba(255, 255, 255, 0.45);
    --card: #faf9f5;
    --card-text: #111111;
    --font: "VCR", "VT323", ui-monospace, monospace;
    --radius: 14px;
  }
  @font-face {
    font-family: "VCR";
    src: url("fonts/VCR_OSD_MONO.ttf") format("truetype");
    font-display: swap;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* VHS-ish atmosphere */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(244, 91, 91, 0.10), transparent 60%),
      radial-gradient(800px 500px at 50% 110%, rgba(255, 255, 255, 0.05), transparent 60%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  .wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 560px; margin: 0 auto;
    padding: 28px 16px 40px;
  }

  /* top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim);
  }
  .live { display: inline-flex; align-items: center; gap: 8px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 10px var(--live); animation: blink 1.6s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center;
    border-radius: 10px; border: 1px solid var(--panel-border); background: var(--bar);
    cursor: pointer; transition: border-color .2s, transform .2s;
  }
  .icon-btn:hover { border-color: var(--underline); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* profile */
  .profile { text-align: center; margin-top: 26px; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto;
    border: 1px solid var(--rule);
    box-shadow: 0 0 0 6px var(--bar), 0 0 0 7px var(--panel-border), 0 20px 50px rgba(244, 91, 91, 0.12);
  }
  .name { margin-top: 22px; font-size: 32px; line-height: 1.1; letter-spacing: 0.02em; }
  .bio { margin: 10px auto 0; max-width: 40ch; font-size: 15px; line-height: 1.5; color: var(--text-dim); }
  .bio a { color: var(--text); border-bottom: 1px solid var(--underline); }

  .socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .social {
    width: 46px; height: 46px; display: grid; place-items: center; position: relative;
    border-radius: 12px; background: var(--bar); border: 1px solid var(--panel-border);
    transition: transform .2s, border-color .2s, background .2s;
  }
  .social svg { width: 20px; height: 20px; fill: currentColor; }
  .social .sicon, .aitem .sicon { width: 20px; height: 20px; object-fit: contain; filter: grayscale(1) brightness(0) invert(1); }
  .social:hover, .social:focus-visible { transform: translateY(-3px); border-color: var(--live); outline: none; }
  .social .tag {
    position: absolute; bottom: -4px; right: -4px; font-size: 10px; line-height: 1;
    padding: 2px 4px; border-radius: 6px; background: var(--live); color: #000;
  }
  .social[data-tip]:hover::after, .social[data-tip]:focus-visible::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    white-space: nowrap; font-size: 11px; padding: 4px 8px; border-radius: 6px;
    background: var(--card); color: var(--card-text); pointer-events: none; z-index: 5;
  }

  /* sections */
  .section { margin-top: 34px; }
  .section-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-faint);
  }
  .section-head::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .section-head .count { color: var(--live); }
  .links { display: grid; gap: 10px; }

  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px 12px 12px; min-height: 68px;
    border-radius: var(--radius); background: var(--panel); border: 1px solid var(--panel-border);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
    opacity: 0; transform: translateY(8px); animation: rise .5s ease forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .link:hover, .link:focus-visible { transform: translateY(-2px); border-color: var(--underline); background: var(--bar); outline: none; }
  .link:hover .arrow { transform: translate(3px, -3px); color: var(--live); }
  .link .ico {
    flex: none; width: 44px; height: 44px; border-radius: 11px; overflow: hidden;
    display: grid; place-items: center; background: #1a1a1d; border: 1px solid var(--panel-border);
  }
  .link .ico img { width: 100%; height: 100%; object-fit: cover; }
  .link .ico.pad img { width: 70%; height: 70%; object-fit: contain; }
  .link .ico .mono { font-size: 20px; color: var(--text-dim); }
  .link .txt { flex: 1; min-width: 0; }
  .link .title { font-size: 16px; line-height: 1.25; }
  .link .sub { margin-top: 3px; font-size: 12.5px; line-height: 1.4; color: var(--text-faint);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .link .arrow { flex: none; width: 16px; height: 16px; color: var(--text-faint); transition: transform .2s, color .2s; }

  /* cream "featured" card for the portfolio / first section item */
  .link.feature { background: var(--card); color: var(--card-text); border-color: transparent; }
  .link.feature .sub { color: rgba(17,17,17,0.6); }
  .link.feature .ico { background: #101012; }
  .link.feature .arrow { color: rgba(17,17,17,0.5); }
  .link.feature:hover { background: #fff; border-color: var(--live); }

  footer { margin-top: 44px; text-align: center; font-size: 12px; color: var(--text-faint); letter-spacing: 0.08em; }
  footer button { background: none; border: 0; cursor: pointer; color: inherit; padding: 4px; }
  footer button:hover { color: var(--live); }

  .skeleton { height: 68px; border-radius: var(--radius); background: linear-gradient(90deg, var(--bar), #18181b, var(--bar)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 200;
    padding: 10px 14px; border-radius: 10px; background: var(--card); color: var(--card-text); font-size: 13px;
    transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- admin ---------- */
  .admin {
    position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(0,0,0,0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    overflow-y: auto; padding: 24px 16px;
  }
  .admin.open { display: block; }
  .panel {
    max-width: 640px; margin: 0 auto; background: var(--bar); border: 1px solid var(--panel-border);
    border-radius: 18px; padding: 20px;
  }
  .panel h2 { font-size: 22px; font-weight: normal; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .panel h3 { font-size: 13px; font-weight: normal; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-faint); margin: 22px 0 10px; }
  .muted { color: var(--text-faint); font-size: 13px; line-height: 1.5; }
  .field { display: grid; gap: 6px; margin-top: 12px; }
  .field label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 15px; color: var(--text); background: #000;
    border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; outline: none;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, select:focus, textarea:focus { border-color: var(--live); }
  .btn {
    border: 1px solid var(--rule); background: #000; border-radius: 10px; padding: 9px 14px; cursor: pointer;
    font-size: 14px; transition: border-color .2s, background .2s;
  }
  .btn:hover { border-color: var(--underline); }
  .btn.primary { background: var(--card); color: var(--card-text); border-color: var(--card); }
  .btn.primary:hover { background: #fff; }
  .btn.danger { color: var(--live); }
  .btn.small { padding: 5px 9px; font-size: 13px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .alist { display: grid; gap: 8px; }
  .aitem {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px;
    border: 1px solid var(--panel-border); background: #000;
  }
  .aitem.off { opacity: 0.45; }
  .aitem img { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; flex: none; background: #1a1a1d; }
  .aitem .t { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aitem .t small { display: block; color: var(--text-faint); font-size: 11px; }
  .aitem .ctrls { display: flex; gap: 4px; flex: none; }
  .err { color: var(--live); font-size: 13px; margin-top: 10px; min-height: 1em; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .link { opacity: 1; transform: none; }
  }
</style>

// Recognise the platform from the URL, so a social link shows the right logo even if saved as "Website".
const PLATFORM_HOSTS = {
  "instagram.com": "instagram", "youtube.com": "youtube", "youtu.be": "youtube", "x.com": "x", "twitter.com": "x",
  "github.com": "github", "linkedin.com": "linkedin", "threads.net": "threads", "threads.com": "threads", "tiktok.com": "tiktok",
  "substack.com": "substack", "medium.com": "medium", "spotify.com": "spotify", "facebook.com": "facebook",
};
function detectPlatform(url) {
  if (/^mailto:/i.test(url || "")) return "email";
  const h = hostOf(url).replace(/^www\./, "");
  for (const [d, p] of Object.entries(PLATFORM_HOSTS)) if (h === d || h.endsWith("." + d)) return p;
  return null;
}
function socialIconHTML(s) {
  const p = s.platform && !["website", "custom"].includes(s.platform) ? s.platform : (detectPlatform(s.url) || s.platform);
  if (ICONS[p] && p !== "website") return ICONS[p];
  if (s.icon_url) return `<img class="sicon" src="${esc(s.icon_url)}" alt="" loading="lazy">`;
  return ICONS.website;
}
const ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (/^(https?:|mailto:)/i.test(u || "") ? u : "#");
const hostOf = (u) => { try { return new URL(u).hostname; } catch { return ""; } };
const faviconFor = (u) => `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostOf(u))}&sz=128`;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}
const rpc = (fn, args) => api(`rpc/${fn}`, { method: "POST", body: JSON.stringify(args) });

/* ---------- public render ---------- */
function linkIcon(l) {
  const src = l.icon_url || faviconFor(l.url);
  const letter = esc((l.title || "?").trim()[0] || "?");
  return `<span class="ico${l.icon_url ? "" : " pad"}"><img src="${esc(src)}" alt="" loading="lazy"
    onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'mono',textContent:'${letter}'}))"></span>`;
}

function render({ profile, links }) {
  if (profile) {
    $("#name").textContent = profile.name || "Abhinav Kuchhal";
    $("#bio").innerHTML = esc(profile.bio || "").replace(/@([A-Za-z0-9._]+)/g,
      (m, h) => `<a href="https://www.instagram.com/${h}/" target="_blank" rel="noopener">@${h}</a>`);
    if (profile.avatar_url) $("#avatar").src = profile.avatar_url;
    document.title = `${profile.name || "Abhinav Kuchhal"} · Links`;
  }

  const socials = links.filter((l) => l.kind === "social");
  $("#socials").innerHTML = socials.map((s) => {
    const icon = socialIconHTML(s);
    const tag = s.subtitle && s.subtitle.length <= 3 ? `<span class="tag">${esc(s.subtitle)}</span>` : "";
    return `<a class="social" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener" aria-label="${esc(s.title)}" data-tip="${esc(s.title)}">${icon}${tag}</a>`;
  }).join("");

  const cards = links.filter((l) => l.kind !== "social");
  const groups = new Map();
  for (const l of cards) {
    const k = l.section || "Links";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(l);
  }
  const rank = (k) => { const i = SECTION_ORDER.indexOf(k); return i === -1 ? -1 : i; }; // unknown sections (e.g. Website) first
  const ordered = [...groups.entries()].sort((a, b) => rank(a[0]) - rank(b[0]));

  let delay = 0;
  $("#sections").innerHTML = ordered.map(([name, items]) => {
    const isLead = rank(name) === -1;
    const head = isLead ? "" : `<div class="section-head">${esc(name)} <span class="count">${String(items.length).padStart(2, "0")}</span></div>`;
    return `<section class="section"${isLead ? ' style="margin-top:28px"' : ""}>${head}<div class="links">${items.map((l) => {
      delay += 60;
      return `<a class="link${isLead ? " feature" : ""}" style="animation-delay:${delay}ms" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">
        ${linkIcon(l)}
        <span class="txt"><span class="title">${esc(l.title)}</span>${l.subtitle ? `<span class="sub">${esc(l.subtitle)}</span>` : ""}</span>
        ${ARROW}</a>`;
    }).join("")}</div></section>`;
  }).join("");
}

async function loadPublic() {
  try {
    const [profiles, links] = await Promise.all([
      api("profile?select=*&id=eq.1"),
      api("links?select=*&is_active=eq.true&order=position.asc"),
    ]);
    render({ profile: profiles[0] || FALLBACK.profile, links });
  } catch (e) {
    console.warn("Using fallback data:", e);
    render(FALLBACK);
  }
}

$("#year").textContent = new Date().getFullYear();
$("#shareBtn").addEventListener("click", async () => {
  const data = { title: document.title, url: location.href.split("#")[0] };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(data.url); toast("Link copied"); }
  } catch {}
});

/* ---------- admin ---------- */
let PW = null;
let ALL = [];

function openAdmin() { $("#admin").classList.add("open"); (PW ? null : $("#pw").focus()); }
function closeAdmin() { $("#admin").classList.remove("open"); if (location.hash === "#admin") history.replaceState(null, "", location.pathname); }
$("#adminBtn").addEventListener("click", openAdmin);
$("#closeAdmin").addEventListener("click", closeAdmin);
$("#admin").addEventListener("click", (e) => { if (e.target.id === "admin") closeAdmin(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAdmin(); });
if (location.hash === "#admin") openAdmin();
window.addEventListener("hashchange", () => location.hash === "#admin" && openAdmin());

async function refreshAdmin() {
  const r = await rpc("admin_login", { p_password: PW });
  if (!r.ok) throw new Error(r.error);
  ALL = r.links;
  drawAdmin();
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  PW = $("#pw").value;
  try {
    await refreshAdmin();
    $("#loginForm").classList.add("hidden");
    $("#dash").classList.remove("hidden");
    const p = (await api("profile?select=*&id=eq.1"))[0] || {};
    $("#p_name").value = p.name || ""; $("#p_bio").value = p.bio || ""; $("#p_avatar").value = p.avatar_url || "";
  } catch (err) {
    PW = null;
    $("#loginErr").textContent = err.message || "Could not log in";
  }
});

function itemHTML(l, i, arr) {
  const src = l.kind === "social" ? null : (l.icon_url || faviconFor(l.url));
  const img = src ? `<img src="${esc(src)}" alt="" onerror="this.style.visibility='hidden'">`
                  : `<span style="width:28px;height:28px;display:grid;place-items:center">${socialIconHTML(l).replace("<svg", '<svg width="18" height="18" fill="currentColor"').replace('class="sicon"', 'class="sicon" style="width:18px;height:18px"')}</span>`;
  return `<div class="aitem${l.is_active ? "" : " off"}" data-id="${l.id}">
    ${img}
    <span class="t">${esc(l.title)}<small>${esc(l.kind === "social" ? l.platform : l.section)} · ${esc(hostOf(l.url))}</small></span>
    <span class="ctrls">
      <button class="btn small" data-act="up" ${i === 0 ? "disabled" : ""} aria-label="Move up">↑</button>
      <button class="btn small" data-act="down" ${i === arr.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button>
      <button class="btn small" data-act="toggle" aria-label="Show or hide">${l.is_active ? "Hide" : "Show"}</button>
      <button class="btn small" data-act="edit">Edit</button>
      <button class="btn small danger" data-act="del" aria-label="Delete">✕</button>
    </span></div>`;
}

function drawAdmin() {
  const socials = ALL.filter((l) => l.kind === "social").sort((a, b) => a.position - b.position);
  const links = ALL.filter((l) => l.kind !== "social").sort((a, b) => a.position - b.position);
  $("#aSocial").innerHTML = socials.map(itemHTML).join("") || '<p class="muted">None yet.</p>';
  $("#aLinks").innerHTML = links.map(itemHTML).join("") || '<p class="muted">None yet.</p>';
  const sections = [...new Set([...SECTION_ORDER, ...links.map((l) => l.section)])];
  $("#sectionList").innerHTML = sections.map((s) => `<option value="${esc(s)}">`).join("");
}

async function act(fn, args, okMsg) {
  try {
    const r = await rpc(fn, { p_password: PW, ...args });
    if (!r.ok) throw new Error(r.error);
    await refreshAdmin();
    loadPublic();
    if (okMsg) toast(okMsg);
    return true;
  } catch (err) { toast(err.message); return false; }
}

document.querySelectorAll("#aSocial, #aLinks").forEach((list) => list.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const id = btn.closest(".aitem").dataset.id;
  const l = ALL.find((x) => x.id === id);
  const group = ALL.filter((x) => (x.kind === "social") === (l.kind === "social")).sort((a, b) => a.position - b.position);
  const i = group.findIndex((x) => x.id === id);
  switch (btn.dataset.act) {
    case "up": case "down": {
      const j = btn.dataset.act === "up" ? i - 1 : i + 1;
      [group[i], group[j]] = [group[j], group[i]];
      await act("admin_reorder", { p_ids: group.map((x) => x.id) });
      break;
    }
    case "toggle": await act("admin_save_link", { p_link: { ...l, is_active: !l.is_active } }, l.is_active ? "Hidden" : "Visible"); break;
    case "edit": openEditor(l); break;
    case "del": if (confirm(`Delete "${l.title}"?`)) await act("admin_delete_link", { p_id: id }, "Deleted"); break;
  }
}));

function syncKind() {
  const social = $("#f_kind").value === "social";
  $("#platformField").classList.toggle("hidden", !social);
  $("#sectionField").classList.toggle("hidden", social);
}
$("#f_kind").addEventListener("change", syncKind);

function openEditor(l = {}, kind = "link") {
  $("#editTitle").textContent = l.id ? "Edit" : "Add new";
  $("#f_id").value = l.id || "";
  $("#f_kind").value = l.kind || kind;
  $("#f_section").value = l.section || "Projects";
  $("#f_platform").value = l.platform || "website";
  $("#f_url").value = l.url || "";
  $("#f_title").value = l.title || "";
  $("#f_subtitle").value = l.subtitle || "";
  $("#f_icon").value = l.icon_url || "";
  $("#f_active").checked = l.is_active ?? true;
  $("#editErr").textContent = "";
  syncKind();
  $("#editForm").classList.remove("hidden");
  $("#editForm").scrollIntoView({ behavior: "smooth", block: "start" });
  $("#f_url").focus();
}
$("#newLink").addEventListener("click", () => openEditor({}, "link"));
$("#newSocial").addEventListener("click", () => openEditor({}, "social"));
$("#cancelEdit").addEventListener("click", () => $("#editForm").classList.add("hidden"));

// Guess the platform/title from the URL as you type
$("#f_url").addEventListener("blur", () => {
  const h = hostOf($("#f_url").value).replace(/^www\./, "");
  const p = detectPlatform($("#f_url").value);
  if (p && $("#f_kind").value === "social") $("#f_platform").value = p;
  else if (h && $("#f_kind").value === "social" && $("#f_platform").value === "website" && $("#f_icon").value) $("#f_platform").value = "custom";
  if (!$("#f_title").value && h) $("#f_title").value = $("#f_kind").value === "social" ? $("#f_platform").selectedOptions[0].text : h;
});

$("#editForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const kind = $("#f_kind").value;
  const link = {
    id: $("#f_id").value || null, kind,
    section: kind === "social" ? "Social" : ($("#f_section").value.trim() || "Projects"),
    platform: kind === "social" ? $("#f_platform").value : null,
    url: $("#f_url").value.trim(), title: $("#f_title").value.trim(),
    subtitle: $("#f_subtitle").value.trim(), icon_url: $("#f_icon").value.trim(),
    is_active: $("#f_active").checked,
  };
  if (!link.id) link.position = ALL.filter((x) => (x.kind === "social") === (kind === "social")).reduce((m, x) => Math.max(m, x.position), 0) + 1;
  if (await act("admin_save_link", { p_link: link }, "Saved")) $("#editForm").classList.add("hidden");
});

$("#profileForm").addEventListener("submit", (e) => {
  e.preventDefault();
  act("admin_save_profile", { p_profile: { name: $("#p_name").value.trim(), bio: $("#p_bio").value.trim(), avatar_url: $("#p_avatar").value.trim() } }, "Profile saved");
});

$("#pwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const np = $("#newPw").value;
  try {
    const r = await rpc("admin_change_password", { p_password: PW, p_new: np });
    if (!r.ok) throw new Error(r.error);
    PW = np; $("#newPw").value = ""; toast("Password updated");
  } catch (err) { toast(err.message); }
});

$("#logout").addEventListener("click", () => {
  PW = null; ALL = [];
  $("#pw").value = "";
  $("#dash").classList.add("hidden"); $("#editForm").classList.add("hidden");
  $("#loginForm").classList.remove("hidden");
  closeAdmin();
});

loadPublic();
</script>
</body>
</html>
